name: Harrison daily stock check

# Reads every Harrison product page (whole catalogue, incl. out-of-stock items) once a day,
# carefully, between 05:00 and 09:00 UK time.
#
#   When   GitHub cron runs in UTC, so there are two triggers (04:07 and 05:07 UTC). The gate
#          step only carries on when it is the 05:00 hour in the UK, so it works in both GMT
#          and BST. The scraper also skips the run if a daily run already started today.
#   Vary   A random wait of 0–60 minutes before starting, so the start time changes each day
#          (roughly 05:10–06:40 UK, plus any GitHub queue delay).
#   Care   2 browser workers, 4–9 s random pause between pages per worker, URLs in random order,
#          pause and then stop if Harrison starts refusing pages, and stop taking new pages at
#          09:00 UK. A full run (~1,150 pages) takes about 1½ hours at this pace.
#   Labels Runs are saved with triggered_by = 'daily' (shown as "daily schedule" in the app).
#
# Run it by hand from the Actions tab with "Run workflow" (no wait, no time gate).

on:
  schedule:
    - cron: '7 4 * * *'   # 05:07 BST (summer)
    - cron: '7 5 * * *'   # 05:07 GMT (winter)
  workflow_dispatch:
    inputs:
      stop_at:
        description: 'Stop taking new pages at this UK time (HH:MM). Blank = no limit.'
        required: false
        default: ''

concurrency:
  group: harrison-stock-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Only run in the 05:00 UK hour
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=yes" >> $GITHUB_OUTPUT; exit 0
          fi
          H=$(TZ=Europe/London date +%H)
          echo "UK time now: $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')"
          if [ "$H" = "05" ] || [ "$H" = "06" ]; then
            echo "go=yes" >> $GITHUB_OUTPUT
          else
            echo "Not the 05:00 UK hour (this is the other season's trigger) — skipping."
            echo "go=no" >> $GITHUB_OUTPUT
          fi

      - name: Random wait (0–60 min) so the start time varies
        if: steps.gate.outputs.go == 'yes' && github.event_name == 'schedule'
        run: |
          S=$(( RANDOM % 3600 ))
          echo "Waiting $((S/60)) min $((S%60)) s"
          sleep $S

      - name: Checkout repo
        if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.gate.outputs.go == 'yes'
        run: pip install supabase playwright httpx
      - name: Install Playwright browsers
        if: steps.gate.outputs.go == 'yes'
        run: python -m playwright install --with-deps chromium

      - name: Run Harrison stock check (whole catalogue)
        if: steps.gate.outputs.go == 'yes'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HARRISON_MODE:        oos_catalogue
          HARRISON_TRIGGER:     ${{ github.event_name == 'schedule' && 'daily' || 'manual' }}
          HARRISON_SHUFFLE:     '1'
          HARRISON_STOP_AT:     ${{ github.event_name == 'schedule' && '09:00' || github.event.inputs.stop_at }}
          SCRAPER_WORKERS:      '2'
          SCRAPER_DELAY_MIN:    '4'
          SCRAPER_DELAY_MAX:    '9'
        run: python scraper/harrison_stock.py
