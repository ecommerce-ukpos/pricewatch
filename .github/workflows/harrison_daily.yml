name: Harrison daily stock check

# Reads every Harrison product page (whole catalogue, incl. out-of-stock items), carefully.
#
#   When   Started by Supabase, not by a GitHub schedule (GitHub's scheduled runs were starting
#          6–7 hours late). Each morning public.harrison_daily_tick() (pg_cron, every minute
#          04:00–08:59 UTC) picks a random UK time between 05:00 and 08:30, and at that time asks
#          the smart-function Edge Function {mode:"harrison_daily"} to start this workflow with
#          trigger=daily. See supabase/migrations/012_harrison_daily_pg_cron.sql.
#   Once   The scraper skips the run if a daily run already started today (UK date), so a
#          repeated call can't run it twice.
#   Care   2 browser workers, 4–9 s random pause between pages per worker, URLs in random order,
#          pause and then stop if Harrison starts refusing pages, and stop taking new pages at
#          stop_at (11:30 UK for the daily run). A full run (~1,150 pages) takes about 1½ hours.
#   Labels Runs are saved with triggered_by = 'daily' or 'manual'.
#
# Run it by hand from the Actions tab with "Run workflow" (trigger = manual).

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'daily (from Supabase) or manual'
        required: false
        default: 'manual'
      stop_at:
        description: 'Stop taking new pages at this UK time (HH:MM). Blank = no limit.'
        required: false
        default: ''

run-name: Harrison stock check (${{ github.event.inputs.trigger || 'manual' }})

concurrency:
  group: harrison-stock-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install supabase playwright httpx
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run Harrison stock check (whole catalogue)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HARRISON_MODE:        oos_catalogue
          HARRISON_TRIGGER:     ${{ github.event.inputs.trigger == 'daily' && 'daily' || 'manual' }}
          HARRISON_SHUFFLE:     '1'
          HARRISON_STOP_AT:     ${{ github.event.inputs.stop_at }}
          SCRAPER_WORKERS:      '2'
          SCRAPER_DELAY_MIN:    '4'
          SCRAPER_DELAY_MAX:    '9'
        run: python scraper/harrison_stock.py
